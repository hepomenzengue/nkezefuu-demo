name: Déploiement de demo.nkezefuu.com

# Chaque push sur master part directement sur l'instance Odoo 20 de démonstration
# (demo.nkezefuu.com). Travailler sur une autre branche, et ne fusionner dans
# master que ce qui doit être déployé.
#
# Les sources Odoo 20 et le venv sont partagés avec auchamp sous /opt/nkezefuu/odoo20/ ;
# ce dépôt est cloné dans /opt/nkezefuu/odoo20/demo/, avec la conf
# /etc/nkezefuu-demo.conf et le service systemd nkezefuu-demo.
on:
  push:
    branches:
      - master

jobs:
  verifier:
    # Garde-fou avant tout déploiement : un module installé qui ne se charge pas
    # empêche Odoo d'ouvrir la base, et l'instance tombe.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Même version que le venv du serveur.
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compiler le Python
        run: python -m compileall -q .

      - name: Vérifier les manifestes et les fichiers XML, CSV et JSON
        run: |
          python - <<'PY'
          import ast, csv, glob, json, os, sys
          import xml.dom.minidom
          erreurs = []
          modules = sorted(os.path.dirname(m) for m in glob.glob('*/__manifest__.py'))
          for module in modules:
              try:
                  with open(os.path.join(module, '__manifest__.py'), encoding='utf-8') as h:
                      manifest = ast.literal_eval(h.read())
              except Exception as e:
                  erreurs.append('%s/__manifest__.py : %s' % (module, e))
                  continue
              erreurs += ['%s : fichier du manifeste absent : %s' % (module, d)
                          for cle in ('data', 'demo') for d in manifest.get(cle, [])
                          if not os.path.exists(os.path.join(module, d))]
              for f in glob.glob('%s/**/*.xml' % module, recursive=True):
                  try:
                      xml.dom.minidom.parse(f)
                  except Exception as e:
                      erreurs.append('%s : %s' % (f, e))
              for f in glob.glob('%s/**/*.json' % module, recursive=True):
                  try:
                      with open(f, encoding='utf-8') as h:
                          json.load(h)
                  except Exception as e:
                      erreurs.append('%s : %s' % (f, e))
              # Odoo 20 a remplacé ir.model.access.csv (8 colonnes perm_*) par ir.access.csv
              # (operation, domain) : on contrôle seulement que chaque ligne a autant de
              # colonnes que l'en-tête, quel que soit le format.
              for f in glob.glob('%s/**/*.csv' % module, recursive=True):
                  with open(f, encoding='utf-8') as h:
                      lignes = list(csv.reader(h))
                  if lignes:
                      erreurs += ['%s ligne %d : %d colonnes au lieu de %d' % (f, i + 1, len(l), len(lignes[0]))
                                  for i, l in enumerate(lignes) if l and len(l) != len(lignes[0])]
          print('%d modules vérifiés' % len(modules))
          print('\n'.join(erreurs) or 'Fichiers valides')
          sys.exit(1 if erreurs else 0)
          PY

  deploy:
    needs: verifier
    runs-on: ubuntu-latest
    # Un seul déploiement à la fois : deux pushes rapprochés feraient la queue au lieu
    # d'écrire en même temps dans le même répertoire du VPS.
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    env:
      DEPLOY_PATH: /opt/nkezefuu/odoo20/demo/nkezefuu-demo
      SERVICE: nkezefuu-demo
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd $DEPLOY_PATH || exit 1; \
             git fetch --prune origin master || echo 'fetch en echec, poursuite avec la reference locale'; \
             git reset --hard origin/master && \
             echo 'Commit deploye :' && git log --oneline -1"

      - name: Clear Python cache
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "find $DEPLOY_PATH -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null; echo 'Cache Python nettoye'"

      # Comme pour nkezefuu-management, les modules ne sont pas mis à jour ici : un
      # redémarrage recharge le Python, mais ne crée ni table ni colonne et ne
      # recharge ni données ni droits. Après un changement de modèle, de droits ou
      # de données, lancer -u <module> à la main.
      - name: Restart Odoo service
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "sudo systemctl restart $SERVICE && echo \"Service $SERVICE redemarre avec succes\""

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
